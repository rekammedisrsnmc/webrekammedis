<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="logorekammedis.ico">
<title>Admin Pemusnahan | Medical Record</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --green:#2fa36b;
  --green-dark:#1f7f53;
  --bg:#f0f7f3;
  --card:#ffffff;
  --shadow:0 4px 20px rgba(0,0,0,.06);
  --sidebar-width:240px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}

body{
  background:var(--bg);
  min-height:100vh;
}

/* ===== LAYOUT ===== */
.layout{
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:var(--sidebar-width);
  background:#ffffff;
  padding:0;
  flex-shrink:0;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  box-shadow:4px 0 30px rgba(0,0,0,.04);
  z-index:10;
  border-right:1px solid #e8f0ec;
  display:flex;
  flex-direction:column;
  transition:transform .3s ease;
}

.sidebar-brand{
  padding:20px;
  border-bottom:1px solid #eef5f2;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sidebar-brand img{
  height:50px;
  width:auto;
}

.sidebar-menu{
  padding:16px 12px;
  flex:1;
}
.sidebar-menu a{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 16px;
  color:#5a6b62;
  text-decoration:none;
  border-radius:10px;
  transition:all .2s;
  font-weight:500;
  font-size:14px;
  margin-bottom:2px;
}
.sidebar-menu a i{
  width:20px;
  text-align:center;
  font-size:15px;
  color:#9ab0a4;
  transition:.2s;
}
.sidebar-menu a:hover{
  background:#f0f7f3;
  color:var(--green-dark);
}
.sidebar-menu a:hover i{
  color:var(--green);
}
.sidebar-menu a.active{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  box-shadow:0 4px 16px rgba(47,163,107,.25);
}
.sidebar-menu a.active i{
  color:#fff;
}

/* ===== SUB MENU IMUT ===== */
.menu-toggle{
  justify-content:space-between;
  cursor:pointer;
}
.menu-toggle .arrow{
  margin-left:auto;
  transition:.4s;
  font-size:12px;
}
.submenu{
  max-height:0;
  overflow:hidden;
  margin-left:20px;
  transition:max-height .4s cubic-bezier(.4,0,.2,1);
}
.submenu a{
  font-size:13px;
  padding:8px 16px;
  margin-bottom:2px;
  background:rgba(47,163,107,.06);
  border-radius:8px;
  color:#5a6b62;
}
.submenu a i{
  font-size:13px;
  width:18px;
}
.submenu a:hover{
  background:rgba(47,163,107,.12);
  color:var(--green-dark);
}
.submenu a.active{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
}
.submenu a.active i{
  color:#fff;
}
.submenu.show{
  max-height:400px;
}
.submenu.show ~ .menu-toggle .arrow{
  transform:rotate(180deg);
}

/* ===== TOGGLE SIDEBAR MOBILE ===== */
.sidebar-toggle{
  display:none;
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  background:var(--green);
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(47,163,107,.3);
}
.sidebar-overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.4);
  z-index:9;
}

/* ===== CONTENT ===== */
.content{
  flex:1;
  padding:30px 35px;
  min-width:0;
}

/* HEADER */
.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  flex-wrap:wrap;
  gap:12px;
}
.page-header h1{
  font-size:24px;
  font-weight:700;
  color:#1a2e24;
}
.page-header h1 span{
  color:var(--green);
}

/* USER ADMIN - POJOK KANAN */
.user-admin{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  padding:6px 18px 6px 12px;
  border-radius:50px;
  box-shadow:var(--shadow);
  border:1px solid #e8f0ec;
}
.user-admin .avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
  color:#fff;
}
.user-admin .user-name{
  font-size:14px;
  font-weight:600;
  color:#2d3e35;
}
.user-admin .logout-btn{
  background:transparent;
  border:none;
  color:#bccfc4;
  cursor:pointer;
  font-size:16px;
  padding:4px 6px;
  border-radius:50%;
  transition:.2s;
}
.user-admin .logout-btn:hover{
  color:#d9534f;
  background:#fde8e8;
}

/* CARD */
.card{
  background:#fff;
  border-radius:14px;
  padding:24px 28px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
  border:1px solid #e8f0ec;
  transition:.3s;
}
.card:hover{
  border-color:var(--green);
}
.card h3{
  color:var(--green-dark);
  font-size:18px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
}
.card h3 i{
  color:var(--green);
}

label{
  font-size:13px;
  font-weight:600;
  color:#2d3e35;
  display:block;
  margin-bottom:4px;
}
input, textarea{
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #e8f0ec;
  margin-bottom:14px;
  font-size:14px;
  background:#fafcfa;
  transition:.2s;
  font-family:'Segoe UI',Arial,sans-serif;
}
input:focus, textarea:focus{
  outline:none;
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(47,163,107,.1);
}
textarea{
  min-height:100px;
  resize:vertical;
}

.btn-primary{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  border:none;
  padding:12px 28px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(47,163,107,.25);
}
.btn-primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
}
.btn-primary:disabled:hover{
  transform:none;
  box-shadow:none;
}

/* LIST ITEM */
.item{
  display:flex;
  gap:18px;
  padding:16px 6px;
  border-bottom:1px solid #e8f0ec;
  transition:.3s;
}
.item:hover{
  background:#f8fbf9;
  border-radius:10px;
}
.item img{
  width:150px;
  height:100px;
  border-radius:10px;
  object-fit:cover;
  border:1px solid #e8f0ec;
}
.item .info{
  flex:1;
}
.item .judul{
  font-weight:600;
  color:var(--green-dark);
  font-size:16px;
}
.item .meta{
  font-size:13px;
  color:#9ab0a4;
  margin:4px 0 8px;
}
.item .meta i{
  margin-right:4px;
}
.item .narasi{
  background:#f0f7f3;
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  line-height:1.6;
  color:#3d5a4e;
}
.item .actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.item .actions .btn-delete{
  background:#fee2e2;
  border:1px solid #fecaca;
  color:#b91c1c;
  width:36px;
  height:36px;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.item .actions .btn-delete:hover{
  background:#fecaca;
  transform:scale(1.05);
}

#status{
  margin-top:12px;
  font-weight:600;
  color:var(--green);
}

footer{
  text-align:center;
  font-size:13px;
  color:#bccfc4;
  margin-top:30px;
  padding-top:16px;
  border-top:1px solid #e8f0ec;
}

/* ===== SPINNER INLINE (kaya punya asuransi) ===== */
.loading-wrapper{
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:center;
  padding:40px 0;
  color:#9ab0a4;
}
.spinner-small{
  width:20px;
  height:20px;
  border:3px solid #e8f0ec;
  border-top:3px solid var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
.spinner-sm{
  display:inline-block;
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,0.3);
  border-top:3px solid #fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:#9ab0a4;
}
.empty-state i{
  font-size:50px;
  color:var(--green);
  opacity:0.3;
  display:block;
  margin-bottom:15px;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#1a2e24;
  color:#fff;
  padding:12px 28px;
  border-radius:50px;
  font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  display:none;
  z-index:9999;
  font-size:14px;
}
.toast.show{display:block;animation:slideUpToast .4s ease;}
.toast.error{background:#d9534f;}

@keyframes slideUpToast{
  from{opacity:0;transform:translate(-50%,20px)}
  to{opacity:1;transform:translate(-50%,0)}
}

/* ===== RESPONSIVE MOBILE ===== */
@media(max-width:768px){
  .sidebar-toggle{
    display:block;
  }
  .sidebar{
    position:fixed;
    top:0;
    left:0;
    transform:translateX(-100%);
    height:100vh;
    width:280px;
    z-index:10;
    box-shadow:4px 0 40px rgba(0,0,0,.15);
  }
  .sidebar.open{
    transform:translateX(0);
  }
  .sidebar-overlay.show{
    display:block;
  }
  .content{
    padding:18px 16px;
    padding-top:70px;
  }
  .page-header{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
  }
  .page-header h1{
    font-size:20px;
  }
  .user-admin{
    justify-content:center;
    padding:6px 14px;
  }
  .user-admin .user-name{
    font-size:13px;
  }
  .card{
    padding:18px 16px;
  }
  .card h3{
    font-size:16px;
  }
  .item{
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .item img{
    width:100%;
    height:auto;
    max-height:200px;
  }
  .item .actions{
    margin-top:10px;
  }
}

@media(max-width:480px){
  .user-admin .user-name{
    display:none;
  }
}

@media(min-width:769px){
  .sidebar-toggle{
    display:none !important;
  }
  .sidebar-overlay{
    display:none !important;
  }
}
</style>
</head>

<body>

<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
  <i class="fas fa-bars"></i>
</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="logopanjang.png" alt="Medical Record">
    </div>

    <nav class="sidebar-menu">

      <!-- ===== IMUT DROPDOWN ===== -->
      <a href="javascript:void(0)" class="menu-toggle" onclick="toggleImut()">

        <i class="fas fa-chevron-down arrow" id="imutArrow"></i>

  <main class="content">

    <div class="page-header">

<!-- ===== TOAST ===== -->
<div class="toast" id="toastMsg"></div>

<script>
// ========== CEK LOGIN ==========
if (!sessionStorage.getItem('adminName')) {
  window.location.href = 'index.html';
}

// ========== GET ADMIN USERNAME ==========
function getAdminName() {
  return sessionStorage.getItem('adminName') || 'Admin';
}

// ========== TOAST ==========
function showToast(msg, isError = false) {
  const toast = document.getElementById('toastMsg');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ========== LOGOUT ==========
function logout() {
  if (confirm('Yakin ingin logout?')) {
    sessionStorage.removeItem('adminName');
    sessionStorage.removeItem('toastShown');
    showToast('👋 Logout berhasil!');
    setTimeout(() => window.location.href = 'index.html', 600);
  }
}

// ========== SIDEBAR TOGGLE MOBILE ==========
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// ========== TOGGLE IMUT DROPDOWN ==========
function toggleImut() {
  const sub = document.getElementById('imutSubmenu');
  const arrow = document.getElementById('imutArrow');
  sub.classList.toggle('show');
  arrow.classList.toggle('rotate');
}

// ========== PEMUSNAHAN ==========
const API_URL = "https://script.google.com/macros/s/AKfycby-ZQ3obQ7jkIsEi2tu-HQyINZmlcP04sElMDG-VuMvZnAThwgeU2gLrsj9gCmYsP4T/exec";
const list = document.getElementById("list");

function driveImg(url) {
  if (!url) return "";
  const id = url.match(/[-\\w]{25,}/);
  return id ? `https://drive.google.com/thumbnail?id=${id[0]}&sz=w1000` : url;
}

function loadData() {
  list.innerHTML = `
    <div class="loading-wrapper">
      <div class="spinner-small"></div>
      <span>Memuat data pemusnahan...</span>
    </div>
  `;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "get" })
  })
  .then(r => r.json())
  .then(d => {
    list.innerHTML = "";
    if (d.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>Belum ada data pemusnahan</p>
          <p style="font-size:13px;color:#bccfc4;margin-top:4px;">Silakan tambahkan data di form atas</p>
        </div>
      `;
      return;
    }
    d.forEach((x, i) => {
      list.innerHTML += `
        <div class="item" style="animation-delay:${i * 0.08}s">
          <img src="${driveImg(x.foto)}" alt="Foto Pemusnahan">
          <div class="info">
            <div class="judul">${x.judul || 'Tanpa Judul'}</div>
            <div class="meta">
              <i class="fas fa-calendar-alt"></i> ${x.tanggal ? new Date(x.tanggal).toLocaleDateString("id-ID") : '-'} 
              <i class="fas fa-map-marker-alt" style="margin-left:12px;"></i> ${x.lokasi || '-'}
            </div>
            <div class="narasi">${x.isi || '-'}</div>
          </div>
          <div class="actions">
            <button class="btn-delete" onclick="hapus('${x.id}')" title="Hapus">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      `;
    });
  })
  .catch(() => {
    showToast('❌ Gagal memuat data!', true);
    list.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-exclamation-triangle"></i>
        <p>Gagal memuat data</p>
      </div>
    `;
  });
}

function simpan() {
  const file = document.getElementById('foto').files[0];
  const judul = document.getElementById('judul').value.trim();
  const tanggal = document.getElementById('tanggal').value;
  const lokasi = document.getElementById('lokasi').value.trim();
  const isi = document.getElementById('isi').value.trim();

  if (!file) {
    showToast('❌ Foto wajib diupload!', true);
    return;
  }
  if (!judul) {
    showToast('❌ Judul wajib diisi!', true);
    return;
  }
  if (!tanggal) {
    showToast('❌ Tanggal wajib diisi!', true);
    return;
  }

  const btn = document.getElementById('simpanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Menyimpan...';

  const reader = new FileReader();
  reader.onload = () => {
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "save",
        judul: judul,
        tanggal: tanggal,
        lokasi: lokasi,
        isi: isi,
        foto: reader.result
      })
    })
    .then(() => {
      document.getElementById('status').innerHTML = '✅ Data berhasil disimpan!';
      document.getElementById('status').style.color = 'var(--green)';
      document.getElementById('judul').value = '';
      document.getElementById('lokasi').value = '';
      document.getElementById('isi').value = '';
      document.getElementById('foto').value = '';
      showToast('✅ Data pemusnahan berhasil disimpan!');
      loadData();
      btn.innerHTML = '<i class="fas fa-save"></i> Simpan';
      btn.disabled = false;
    })
    .catch(() => {
      showToast('❌ Gagal menyimpan data!', true);
      btn.innerHTML = '<i class="fas fa-save"></i> Simpan';
      btn.disabled = false;
    });
  };
  reader.readAsDataURL(file);
}

function hapus(id) {
  if (!confirm('Yakin ingin menghapus data ini?')) return;
  
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "hapus", id })
  })
  .then(() => {
    showToast('✅ Data berhasil dihapus!');
    loadData();
  })
  .catch(() => {
    showToast('❌ Gagal menghapus data!', true);
  });
}

// ========== ONLOAD ==========
document.addEventListener("DOMContentLoaded", function() {
  const name = getAdminName();
  document.getElementById('userNameDisplay').textContent = name;
  document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
  
  // Set tanggal default hari ini
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('tanggal').value = today;
  
  loadData();
  
  const toastShown = sessionStorage.getItem('toastShown');
  if (!toastShown) {
    setTimeout(() => showToast(`👋 Selamat datang, ${name}!`), 300);
    sessionStorage.setItem('toastShown', 'true');
  }
});

// ========== SHORTCUT ==========
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') logout();
});

// ========== CLOSE SIDEBAR SAAT RESIZE ==========
window.addEventListener('resize', function() {
  if (window.innerWidth > 768) {
    closeSidebar();
  }
});
</script>

</body>
</html>
