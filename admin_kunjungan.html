<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="logorekammedis.ico">
<title>Admin Kunjungan | Medical Record</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --green:#2fa36b;
  --green-dark:#1f7f53;
  --bg:#f0f7f3;
  --card:#ffffff;
  --shadow:0 4px 20px rgba(0,0,0,.06);
  --sidebar-width:240px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}

body{
  background:var(--bg);
  min-height:100vh;
}

/* ===== LAYOUT ===== */
.layout{
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:var(--sidebar-width);
  background:#ffffff;
  padding:0;
  flex-shrink:0;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  box-shadow:4px 0 30px rgba(0,0,0,.04);
  z-index:10;
  border-right:1px solid #e8f0ec;
  display:flex;
  flex-direction:column;
  transition:transform .3s ease;
}

.sidebar-brand{
  padding:20px;
  border-bottom:1px solid #eef5f2;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sidebar-brand img{
  height:50px;
  width:auto;
}

.sidebar-menu{
  padding:16px 12px;
  flex:1;
}
.sidebar-menu a{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 16px;
  color:#5a6b62;
  text-decoration:none;
  border-radius:10px;
  transition:all .2s;
  font-weight:500;
  font-size:14px;
  margin-bottom:2px;
}
.sidebar-menu a i{
  width:20px;
  text-align:center;
  font-size:15px;
  color:#9ab0a4;
  transition:.2s;
}
.sidebar-menu a:hover{
  background:#f0f7f3;
  color:var(--green-dark);
}
.sidebar-menu a:hover i{
  color:var(--green);
}
.sidebar-menu a.active{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  box-shadow:0 4px 16px rgba(47,163,107,.25);
}
.sidebar-menu a.active i{
  color:#fff;
}

/* ===== SUB MENU IMUT ===== */
.menu-toggle{
  justify-content:space-between;
  cursor:pointer;
}
.menu-toggle .arrow{
  margin-left:auto;
  transition:.4s;
  font-size:12px;
}
.submenu{
  max-height:0;
  overflow:hidden;
  margin-left:20px;
  transition:max-height .4s cubic-bezier(.4,0,.2,1);
}
.submenu a{
  font-size:13px;
  padding:8px 16px;
  margin-bottom:2px;
  background:rgba(47,163,107,.06);
  border-radius:8px;
  color:#5a6b62;
}
.submenu a i{
  font-size:13px;
  width:18px;
}
.submenu a:hover{
  background:rgba(47,163,107,.12);
  color:var(--green-dark);
}
.submenu a.active{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
}
.submenu a.active i{
  color:#fff;
}
.submenu.show{
  max-height:400px;
}
.submenu.show ~ .menu-toggle .arrow{
  transform:rotate(180deg);
}

/* ===== TOGGLE SIDEBAR MOBILE ===== */
.sidebar-toggle{
  display:none;
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  background:var(--green);
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(47,163,107,.3);
}
.sidebar-overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.4);
  z-index:9;
}

/* ===== CONTENT ===== */
.content{
  flex:1;
  padding:30px 35px;
  min-width:0;
}

/* HEADER */
.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  flex-wrap:wrap;
  gap:12px;
}
.page-header h1{
  font-size:24px;
  font-weight:700;
  color:#1a2e24;
}
.page-header h1 span{
  color:var(--green);
}

/* USER ADMIN - POJOK KANAN */
.user-admin{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  padding:6px 18px 6px 12px;
  border-radius:50px;
  box-shadow:var(--shadow);
  border:1px solid #e8f0ec;
}
.user-admin .avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
  color:#fff;
}
.user-admin .user-name{
  font-size:14px;
  font-weight:600;
  color:#2d3e35;
}
.user-admin .logout-btn{
  background:transparent;
  border:none;
  color:#bccfc4;
  cursor:pointer;
  font-size:16px;
  padding:4px 6px;
  border-radius:50%;
  transition:.2s;
}
.user-admin .logout-btn:hover{
  color:#d9534f;
  background:#fde8e8;
}

/* CARD */
.card{
  background:#fff;
  border-radius:14px;
  padding:24px 28px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
  border:1px solid #e8f0ec;
  transition:.3s;
}
.card:hover{
  border-color:var(--green);
}
.card h3{
  color:var(--green-dark);
  font-size:18px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
}
.card h3 i{
  color:var(--green);
}

label{
  font-size:13px;
  font-weight:600;
  color:#2d3e35;
  display:block;
  margin-bottom:4px;
}
select, input{
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #e8f0ec;
  margin-bottom:14px;
  font-size:14px;
  background:#fafcfa;
  transition:.2s;
}
select:focus, input:focus{
  outline:none;
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(47,163,107,.1);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border:1px solid #e8f0ec;
  padding:8px 10px;
  text-align:center;
}
th{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  font-weight:600;
}
td input{
  width:80px;
  padding:6px 8px;
  margin:0;
  text-align:center;
  border-radius:6px;
}
td input:read-only{
  background:#f0f7f3;
  font-weight:700;
  color:var(--green-dark);
}

.btn-primary{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  border:none;
  padding:12px 28px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(47,163,107,.25);
}
.btn-primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
}
.btn-primary:disabled:hover{
  transform:none;
  box-shadow:none;
}

footer{
  text-align:center;
  font-size:13px;
  color:#bccfc4;
  margin-top:30px;
  padding-top:16px;
  border-top:1px solid #e8f0ec;
}

/* ===== SPINNER INLINE (kaya punya asuransi) ===== */
.loading-wrapper{
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:center;
  padding:40px 0;
  color:#9ab0a4;
}
.spinner-small{
  width:20px;
  height:20px;
  border:3px solid #e8f0ec;
  border-top:3px solid var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
.spinner-sm{
  display:inline-block;
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,0.3);
  border-top:3px solid #fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}

/* TOAST */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#1a2e24;
  color:#fff;
  padding:12px 28px;
  border-radius:50px;
  font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  display:none;
  z-index:9999;
  font-size:14px;
}
.toast.show{display:block;animation:slideUpToast .4s ease;}
.toast.error{background:#d9534f;}

@keyframes slideUpToast{
  from{opacity:0;transform:translate(-50%,20px)}
  to{opacity:1;transform:translate(-50%,0)}
}

/* ===== RESPONSIVE MOBILE ===== */
@media(max-width:768px){
  .sidebar-toggle{
    display:block;
  }
  .sidebar{
    position:fixed;
    top:0;
    left:0;
    transform:translateX(-100%);
    height:100vh;
    width:280px;
    z-index:10;
    box-shadow:4px 0 40px rgba(0,0,0,.15);
  }
  .sidebar.open{
    transform:translateX(0);
  }
  .sidebar-overlay.show{
    display:block;
  }
  .content{
    padding:18px 16px;
    padding-top:70px;
  }
  .page-header{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
  }
  .page-header h1{
    font-size:20px;
  }
  .user-admin{
    justify-content:center;
    padding:6px 14px;
  }
  .user-admin .user-name{
    font-size:13px;
  }
  .card{
    padding:18px 16px;
  }
  .card h3{
    font-size:16px;
  }
  table{
    font-size:12px;
  }
  th,td{
    padding:4px 6px;
  }
  td input{
    width:60px;
    padding:4px;
  }
}

@media(max-width:480px){
  .user-admin .user-name{
    display:none;
  }
  table{
    font-size:11px;
  }
  th,td{
    padding:3px 4px;
  }
  td input{
    width:50px;
    padding:3px;
    font-size:11px;
  }
}

@media(min-width:769px){
  .sidebar-toggle{
    display:none !important;
  }
  .sidebar-overlay{
    display:none !important;
  }
}
</style>
</head>

<body>

<!-- ===== TOGGLE SIDEBAR MOBILE ===== -->
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
  <i class="fas fa-bars"></i>
</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="logopanjang.png" alt="Medical Record">
    </div>

    <nav class="sidebar-menu">
      <a href="admin_index.html"><i class="fas fa-gauge-high"></i> Dashboard</a>
      <a href="admin_regulasi.html"><i class="fas fa-file-medical"></i> Regulasi</a>
      <a class="active"><i class="fas fa-chart-simple"></i> Kunjungan</a>
      <a href="admin_jadwal.html"><i class="fas fa-calendar-check"></i> Jadwal</a>
      
      <!-- ===== IMUT DROPDOWN ===== -->
      <a href="javascript:void(0)" class="menu-toggle" onclick="toggleImut()">
        <i class="fas fa-chart-line"></i>
        <span>IMUT</span>
        <i class="fas fa-chevron-down arrow" id="imutArrow"></i>
      </a>
      <div class="submenu" id="imutSubmenu">
        <a href="admin_imutrekammedis.html">
          <i class="fas fa-file-medical"></i> Rekam Medis
        </a>
        <a href="admin_imutpendaftaran.html">
          <i class="fas fa-user-plus"></i> Pendaftaran
        </a>
        <a href="admin_imutcustomercare.html">
          <i class="fas fa-headset"></i> Customer Care
        </a>
      </div>

      <a href="admin_indikatorbor.html"><i class="fas fa-chart-line"></i> Indikator</a>
      <a href="admin_pemusnahan.html"><i class="fas fa-trash"></i> Pemusnahan</a>
      <a href="admin_daftarasuransi.html"><i class="fas fa-shield-alt"></i> Asuransi</a>
    </nav>
  </aside>

  <!-- ===== CONTENT ===== -->
  <main class="content">

    <!-- HEADER -->
    <div class="page-header">
      <h1>Kunjungan <span>Pasien</span></h1>
      
      <div class="user-admin">
        <div class="avatar" id="avatarLetter">A</div>
        <span class="user-name" id="userNameDisplay">Admin</span>
        <button class="logout-btn" onclick="logout()" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>

    <!-- CARD INPUT -->
    <div class="card">
      <h3><i class="fas fa-pen-to-square"></i> Input Kunjungan</h3>
      <label>Tahun</label>
      <select id="tahun"></select>

      <div style="overflow-x:auto;">
        <table id="inputTable">
          <thead>
            <tr>
              <th>Bulan</th>
              <th>Rawat Jalan</th>
              <th>Rawat Inap</th>
              <th>IGD</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <br>
      <button class="btn-primary" id="simpanBtn" onclick="simpan()">
        <i class="fas fa-save"></i> Simpan
      </button>
    </div>

    <!-- CARD REKAP -->
    <div class="card">
      <h3><i class="fas fa-table"></i> <span id="judulTabel">Rekap Kunjungan</span></h3>
      <div style="overflow-x:auto;">
        <div id="tabelContainer">
          <div class="loading-wrapper">
            <div class="spinner-small"></div>
            <span>Memuat data kunjungan...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- CARD GRAFIK -->
    <div class="card">
      <h3><i class="fas fa-chart-bar"></i> <span id="judulGrafik">Grafik Kunjungan</span></h3>
      <div style="height:380px;">
        <canvas id="chartKunjungan"></canvas>
      </div>
    </div>

    <footer>© 2025 RSU An'Nimah • Unit Rekam Medis</footer>
  </main>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toastMsg"></div>

<script>
// ========== CEK LOGIN ==========
if (!sessionStorage.getItem('adminName')) {
  window.location.href = 'index.html';
}

// ========== GET ADMIN USERNAME ==========
function getAdminName() {
  return sessionStorage.getItem('adminName') || 'Admin';
}

// ========== TOAST ==========
function showToast(msg, isError = false) {
  const toast = document.getElementById('toastMsg');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ========== LOGOUT ==========
function logout() {
  if (confirm('Yakin ingin logout?')) {
    sessionStorage.removeItem('adminName');
    sessionStorage.removeItem('toastShown');
    showToast('👋 Logout berhasil!');
    setTimeout(() => window.location.href = 'index.html', 600);
  }
}

// ========== SIDEBAR TOGGLE MOBILE ==========
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// ========== TOGGLE IMUT DROPDOWN ==========
function toggleImut() {
  const sub = document.getElementById('imutSubmenu');
  const arrow = document.getElementById('imutArrow');
  sub.classList.toggle('show');
  arrow.classList.toggle('rotate');
}

// ========== KUNJUNGAN ==========
const API_URL = "https://script.google.com/macros/s/AKfycbz833hLYkNk5v4_Bi1OD-XZBWcpG5k9jUKRh1Zti9gpB31b3QPgN0Y3cTKn5FL-6WSV/exec";
const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

const tbody = document.querySelector("#inputTable tbody");
const tahun = document.getElementById("tahun");
const chartEl = document.getElementById("chartKunjungan");
let chart;

// ========== BUAT ROW INPUT ==========
bulan.forEach(b => {
  tbody.innerHTML += `
    <tr>
      <td><strong>${b}</strong></td>
      <td><input data-b="${b}" data-f="rj" oninput="hitungTotal('${b}')"></td>
      <td><input data-b="${b}" data-f="ri" oninput="hitungTotal('${b}')"></td>
      <td><input data-b="${b}" data-f="igd" oninput="hitungTotal('${b}')"></td>
      <td><input data-b="${b}" data-f="total" readonly style="background:#f0f7f3;font-weight:700;color:var(--green-dark);"></td>
    </tr>
  `;
});

function hitungTotal(b) {
  const rj = +document.querySelector(`[data-b="${b}"][data-f="rj"]`).value || 0;
  const ri = +document.querySelector(`[data-b="${b}"][data-f="ri"]`).value || 0;
  const igd = +document.querySelector(`[data-b="${b}"][data-f="igd"]`).value || 0;
  document.querySelector(`[data-b="${b}"][data-f="total"]`).value = rj + ri + igd;
}

// ========== SIMPAN ==========
function simpan() {
  const btn = document.getElementById('simpanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Menyimpan...';
  
  const data = [];
  bulan.forEach(b => {
    const o = { tahun: tahun.value, bulan: b };
    document.querySelectorAll(`[data-b="${b}"]`).forEach(i => {
      o[i.dataset.f] = Number(i.value) || 0;
    });
    data.push(o);
  });
  
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ bulk: true, data })
  })
  .then(r => r.json())
  .then(() => {
    showToast('✅ Data berhasil disimpan!');
    loadData();
    btn.innerHTML = '<i class="fas fa-save"></i> Simpan';
    btn.disabled = false;
  })
  .catch(() => {
    showToast('❌ Gagal menyimpan data!', true);
    btn.innerHTML = '<i class="fas fa-save"></i> Simpan';
    btn.disabled = false;
  });
}

// ========== LOAD DATA ==========
function loadData() {
  const container = document.getElementById('tabelContainer');
  container.innerHTML = `
    <div class="loading-wrapper">
      <div class="spinner-small"></div>
      <span>Memuat data kunjungan...</span>
    </div>
  `;

  fetch(API_URL + "?tahun=" + tahun.value)
    .then(r => r.json())
    .then(d => {
      let html = `<table>
        <thead>
          <tr>
            <th>Bulan</th>
            <th>Rawat Jalan</th>
            <th>Rawat Inap</th>
            <th>IGD</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>`;
      let rj = [], ri = [], igd = [], total = [];
      
      bulan.forEach(b => {
        const x = d.find(i => i.bulan === b) || {};
        html += `
          <tr>
            <td><strong>${b}</strong></td>
            <td>${x.rj || 0}</td>
            <td>${x.ri || 0}</td>
            <td>${x.igd || 0}</td>
            <td><strong style="color:var(--green-dark);">${x.total || 0}</strong></td>
          </tr>
        `;
        rj.push(x.rj || 0);
        ri.push(x.ri || 0);
        igd.push(x.igd || 0);
        total.push(x.total || 0);
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
      
      document.getElementById('judulTabel').textContent = "Rekap Kunjungan Tahun " + tahun.value;
      document.getElementById('judulGrafik').textContent = "Grafik Kunjungan Tahun " + tahun.value;

      // ========== CHART ==========
      if (chart) chart.destroy();
      chart = new Chart(chartEl, {
        data: {
          labels: bulan,
          datasets: [
            { type: 'bar', label: 'Rawat Jalan', data: rj, backgroundColor: '#2fa36b' },
            { type: 'bar', label: 'Rawat Inap', data: ri, backgroundColor: '#4caf84' },
            { type: 'bar', label: 'IGD', data: igd, backgroundColor: '#81c784' },
            { type: 'line', label: 'Total', data: total, borderColor: '#1f7f53', backgroundColor: 'rgba(47,163,107,.1)', tension: 0.3, fill: true }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    })
    .catch(() => {
      showToast('❌ Gagal memuat data!', true);
      container.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle"></i>
          <p>Gagal memuat data</p>
        </div>
      `;
    });
}

// ========== INIT TAHUN ==========
(function() {
  const now = new Date().getFullYear();
  for (let y = 2020; y <= now + 1; y++) {
    tahun.innerHTML += `<option ${y === now ? "selected" : ""}>${y}</option>`;
  }
})();

// ========== ONLOAD ==========
document.addEventListener("DOMContentLoaded", function() {
  const name = getAdminName();
  document.getElementById('userNameDisplay').textContent = name;
  document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
  
  loadData();
  
  const toastShown = sessionStorage.getItem('toastShown');
  if (!toastShown) {
    setTimeout(() => showToast(`👋 Selamat datang, ${name}!`), 300);
    sessionStorage.setItem('toastShown', 'true');
  }
});

tahun.onchange = loadData;

// ========== SHORTCUT ==========
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') logout();
});

// ========== CLOSE SIDEBAR SAAT RESIZE ==========
window.addEventListener('resize', function() {
  if (window.innerWidth > 768) {
    closeSidebar();
  }
});
</script>
