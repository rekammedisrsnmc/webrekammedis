<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="logorekammedis.ico">
<title>Admin Asuransi | Medical Record</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --green:#2fa36b;
  --green-dark:#1f7f53;
  --bg:#f0f7f3;
  --card:#ffffff;
  --shadow:0 4px 20px rgba(0,0,0,.06);
  --sidebar-width:240px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}

body{
  background:var(--bg);
  min-height:100vh;
}

/* ===== LAYOUT ===== */
.layout{
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:var(--sidebar-width);
  background:#ffffff;
  padding:0;
  flex-shrink:0;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  box-shadow:4px 0 30px rgba(0,0,0,.04);
  z-index:10;
  border-right:1px solid #e8f0ec;
  display:flex;
  flex-direction:column;
  transition:transform .3s ease;
}

.sidebar-brand{
  padding:20px;
  border-bottom:1px solid #eef5f2;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sidebar-brand img{
  height:50px;
  width:auto;
}

.sidebar-menu{
  padding:16px 12px;
  flex:1;
}
.sidebar-menu a{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 16px;
  color:#5a6b62;
  text-decoration:none;
  border-radius:10px;
  transition:all .2s;
  font-weight:500;
  font-size:14px;
  margin-bottom:2px;
}
.sidebar-menu a i{
  width:20px;
  text-align:center;
  font-size:15px;
  color:#9ab0a4;
  transition:.2s;
}
.sidebar-menu a:hover{
  background:#f0f7f3;
  color:var(--green-dark);
}
.sidebar-menu a:hover i{
  color:var(--green);
}
.sidebar-menu a.active{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  box-shadow:0 4px 16px rgba(47,163,107,.25);
}
.sidebar-menu a.active i{
  color:#fff;
}

/* ===== SUB MENU IMUT ===== */
.menu-toggle{
  justify-content:space-between;
  cursor:pointer;
}
.menu-toggle .arrow{
  margin-left:auto;
  transition:.4s;
  font-size:12px;
}
.submenu{
  max-height:0;
  overflow:hidden;
  margin-left:20px;
  transition:max-height .4s cubic-bezier(.4,0,.2,1);
}
.submenu a{
  font-size:13px;
  padding:8px 16px;
  margin-bottom:2px;
  background:rgba(47,163,107,.06);
  border-radius:8px;
  color:#5a6b62;
}
.submenu a i{
  font-size:13px;
  width:18px;
}
.submenu a:hover{
  background:rgba(47,163,107,.12);
  color:var(--green-dark);
}
.submenu a.active{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
}
.submenu a.active i{
  color:#fff;
}
.submenu.show{
  max-height:400px;
}
.submenu.show ~ .menu-toggle .arrow{
  transform:rotate(180deg);
}

/* ===== TOGGLE SIDEBAR MOBILE ===== */
.sidebar-toggle{
  display:none;
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  background:var(--green);
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(47,163,107,.3);
}
.sidebar-overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.4);
  z-index:9;
}

/* ===== CONTENT ===== */
.content{
  flex:1;
  padding:30px 35px;
  min-width:0;
}

/* HEADER */
.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  flex-wrap:wrap;
  gap:12px;
}
.page-header h1{
  font-size:24px;
  font-weight:700;
  color:#1a2e24;
}
.page-header h1 span{
  color:var(--green);
}

/* USER ADMIN - POJOK KANAN */
.user-admin{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  padding:6px 18px 6px 12px;
  border-radius:50px;
  box-shadow:var(--shadow);
  border:1px solid #e8f0ec;
}
.user-admin .avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
  color:#fff;
}
.user-admin .user-name{
  font-size:14px;
  font-weight:600;
  color:#2d3e35;
}
.user-admin .logout-btn{
  background:transparent;
  border:none;
  color:#bccfc4;
  cursor:pointer;
  font-size:16px;
  padding:4px 6px;
  border-radius:50%;
  transition:.2s;
}
.user-admin .logout-btn:hover{
  color:#d9534f;
  background:#fde8e8;
}

/* CARD */
.card{
  background:#fff;
  border-radius:14px;
  padding:24px 28px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
  border:1px solid #e8f0ec;
  transition:.3s;
}
.card:hover{
  border-color:var(--green);
}
.card h3{
  color:var(--green-dark);
  font-size:18px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
}
.card h3 i{
  color:var(--green);
}

label{
  font-size:13px;
  font-weight:600;
  color:#2d3e35;
  display:block;
  margin-bottom:4px;
}
input, textarea{
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #e8f0ec;
  margin-bottom:14px;
  font-size:14px;
  background:#fafcfa;
  transition:.2s;
  font-family:'Segoe UI',Arial,sans-serif;
}
input:focus, textarea:focus{
  outline:none;
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(47,163,107,.1);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px 24px;
}
.form-grid .full{
  grid-column:1 / -1;
}

.btn-group{
  grid-column:1 / -1;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:6px;
}

.btn-primary{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  border:none;
  padding:12px 28px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(47,163,107,.25);
}
.btn-primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
}
.btn-primary:disabled:hover{
  transform:none;
  box-shadow:none;
}

.btn-warning{
  background:#f59e0b;
  color:#fff;
  border:none;
  padding:12px 28px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn-warning:hover{
  background:#d97706;
  transform:translateY(-2px);
}

.btn-danger{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:12px 28px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn-danger:hover{
  background:#dc2626;
  transform:translateY(-2px);
}

.btn-small-danger{
  background:#fee2e2;
  color:#b91c1c;
  border:1px solid #fecaca;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:.3s;
  font-size:13px;
}
.btn-small-danger:hover{
  background:#fecaca;
}

#status{
  grid-column:1 / -1;
  font-size:14px;
  font-weight:600;
  margin-top:-6px;
  color:var(--green);
}

/* LIST ITEM */
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid #e8f0ec;
  transition:.3s;
}
.item:hover{
  background:#f8fbf9;
  border-radius:10px;
}
.item:last-child{
  border-bottom:none;
}
.item .left{
  flex:1;
}
.item .left .nama{
  font-weight:600;
  color:var(--green-dark);
  font-size:16px;
}
.item .left .detail{
  font-size:13px;
  color:#9ab0a4;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:4px;
}
.item .left .detail span{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.item .left .detail .pass{
  font-family:monospace;
  background:#f3f4f6;
  padding:2px 8px;
  border-radius:4px;
  font-size:13px;
  color:#2d3e35;
}
.item .right{
  display:flex;
  gap:8px;
  align-items:center;
}
.item .right .link-btn{
  color:var(--green);
  text-decoration:none;
  font-size:13px;
  padding:4px 12px;
  border-radius:8px;
  background:#f0f7f3;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.item .right .link-btn:hover{
  background:var(--green);
  color:#fff;
}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:#9ab0a4;
}
.empty-state i{
  font-size:50px;
  color:var(--green);
  opacity:0.3;
  display:block;
  margin-bottom:15px;
}

.loading-wrapper{
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:center;
  padding:40px 0;
  color:#9ab0a4;
}
.spinner-small{
  width:20px;
  height:20px;
  border:3px solid #e8f0ec;
  border-top:3px solid var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
.spinner-sm{
  display:inline-block;
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,0.3);
  border-top:3px solid #fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

footer{
  text-align:center;
  font-size:13px;
  color:#bccfc4;
  margin-top:30px;
  padding-top:16px;
  border-top:1px solid #e8f0ec;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#1a2e24;
  color:#fff;
  padding:12px 28px;
  border-radius:50px;
  font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  display:none;
  z-index:9999;
  font-size:14px;
}
.toast.show{display:block;animation:slideUpToast .4s ease;}
.toast.error{background:#d9534f;}

@keyframes slideUpToast{
  from{opacity:0;transform:translate(-50%,20px)}
  to{opacity:1;transform:translate(-50%,0)}
}

/* ===== RESPONSIVE MOBILE ===== */
@media(max-width:768px){
  .sidebar-toggle{
    display:block;
  }
  .sidebar{
    position:fixed;
    top:0;
    left:0;
    transform:translateX(-100%);
    height:100vh;
    width:280px;
    z-index:10;
    box-shadow:4px 0 40px rgba(0,0,0,.15);
  }
  .sidebar.open{
    transform:translateX(0);
  }
  .sidebar-overlay.show{
    display:block;
  }
  .content{
    padding:18px 16px;
    padding-top:70px;
  }
  .page-header{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
  }
  .page-header h1{
    font-size:20px;
  }
  .user-admin{
    justify-content:center;
    padding:6px 14px;
  }
  .user-admin .user-name{
    font-size:13px;
  }
  .card{
    padding:18px 16px;
  }
  .card h3{
    font-size:16px;
  }
  .form-grid{
    grid-template-columns:1fr;
  }
  .form-grid .full{
    grid-column:auto;
  }
  .btn-group{
    flex-direction:column;
  }
  .btn-group button{
    width:100%;
    justify-content:center;
  }
  .item{
    flex-wrap:wrap;
    gap:10px;
  }
  .item .right{
    margin-left:auto;
  }
}

@media(max-width:480px){
  .user-admin .user-name{
    display:none;
  }
  .item .left .detail{
    flex-direction:column;
    gap:4px;
  }
}

@media(min-width:769px){
  .sidebar-toggle{
    display:none !important;
  }
  .sidebar-overlay{
    display:none !important;
  }
}
</style>
</head>

<body>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">

    <nav class="sidebar-menu">

      <!-- ===== IMUT DROPDOWN ===== -->

<!-- ===== TOAST ===== -->
<div class="toast" id="toastMsg"></div>

<script>
// ========== CEK LOGIN ==========
if (!sessionStorage.getItem('adminName')) {
  window.location.href = 'index.html';
}

// ========== GET ADMIN USERNAME ==========
function getAdminName() {
  return sessionStorage.getItem('adminName') || 'Admin';
}

// ========== TOAST ==========
function showToast(msg, isError = false) {
  const toast = document.getElementById('toastMsg');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ========== LOGOUT ==========
function logout() {
  if (confirm('Yakin ingin logout?')) {
    sessionStorage.removeItem('adminName');
    sessionStorage.removeItem('toastShown');
    showToast('👋 Logout berhasil!');
    setTimeout(() => window.location.href = 'index.html', 600);
  }
}

// ========== SIDEBAR TOGGLE MOBILE ==========
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// ========== TOGGLE IMUT DROPDOWN ==========
function toggleImut() {
  const sub = document.getElementById('imutSubmenu');
  const arrow = document.getElementById('imutArrow');
  sub.classList.toggle('show');
  arrow.classList.toggle('rotate');
}

// ========== ASURANSI ==========
const API_URL = "https://script.google.com/macros/s/AKfycbyCmV0DgMN8R2zxQZdnZLSCS7sBmAjcL7E0pMsX7eEqosgRtaPIOxE2l4hG_UVocx6VMg/exec";

// ========== LOAD DATA ==========
function loadData() {
  const box = document.getElementById('list');
  box.innerHTML = `
    <div class="loading-wrapper">
      <div class="spinner-small"></div>
      <span>Memuat data asuransi...</span>
    </div>
  `;

  fetch(`${API_URL}?action=get`)
    .then(res => {
      if (!res.ok) throw new Error('Network error');
      return res.json();
    })
    .then(data => {
      render(data);
    })
    .catch(err => {
      console.error('Error load:', err);
      showToast('⚠️ Gagal memuat data', true);
      render([]);
    });
}

// ========== RENDER ==========
function render(data) {
  const box = document.getElementById('list');
  
  if (!data || data.length === 0) {
    box.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-inbox"></i>
        <p>Belum ada data asuransi</p>
        <p style="font-size:13px;color:#bccfc4;margin-top:4px;">Silakan tambahkan data di form atas</p>
      </div>
    `;
    return;
  }
  
  let html = '';
  data.forEach((item, index) => {
    const asuransi = item[0] || '-';
    const linkApp = item[1] || '';
    const akun = item[2] || '-';
    const password = item[3] || '-';
    const nomorProvider = item[4] || '-';
    const timestamp = item[5] || '';
    
    html += `
      <div class="item">
        <div class="left">
          <div class="nama">${asuransi}</div>
          <div class="detail">
            ${akun !== '-' ? `<span><i class="fas fa-user"></i> ${akun}</span>` : ''}
            ${password !== '-' ? `<span><i class="fas fa-lock"></i> <span class="pass">${password}</span></span>` : ''}
            ${nomorProvider !== '-' ? `<span><i class="fas fa-phone"></i> ${nomorProvider}</span>` : ''}
            ${timestamp ? `<span><i class="fas fa-clock"></i> ${timestamp}</span>` : ''}
          </div>
        </div>
        <div class="right">
          ${linkApp ? `<a href="${linkApp}" target="_blank" class="link-btn"><i class="fas fa-external-link-alt"></i> Buka</a>` : ''}
          <button class="btn-small-danger" onclick="hapusItem(${index})" title="Hapus">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    `;
  });
  
  box.innerHTML = html;
}

// ========== SIMPAN ==========
function simpan() {
  const asuransi = document.getElementById('asuransi').value.trim();
  const linkApp = document.getElementById('linkApp').value.trim();
  const akun = document.getElementById('akun').value.trim();
  const password = document.getElementById('password').value.trim();
  const nomorProvider = document.getElementById('nomorProvider').value.trim();
  
  if (!asuransi) {
    showToast('⚠️ Nama Asuransi wajib diisi!', true);
    document.getElementById('asuransi').focus();
    return;
  }
  
  const btn = document.getElementById('simpanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Menyimpan...';
  document.getElementById('status').textContent = '';
  document.getElementById('status').style.color = 'var(--green)';
  
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'add',
      asuransi: asuransi,
      linkApp: linkApp,
      akun: akun,
      password: password,
      nomorProvider: nomorProvider
    })
  })
  .then(() => {
    showToast('✅ Data berhasil disimpan!');
    document.getElementById('status').textContent = '✅ Data berhasil disimpan!';
    resetForm();
    setTimeout(loadData, 500);
  })
  .catch(err => {
    console.error('Error save:', err);
    showToast('⚠️ Gagal menyimpan data', true);
    document.getElementById('status').textContent = '❌ Gagal menyimpan data';
    document.getElementById('status').style.color = '#ef4444';
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Simpan';
  });
}

// ========== RESET FORM ==========
function resetForm() {
  document.getElementById('asuransi').value = '';
  document.getElementById('linkApp').value = '';
  document.getElementById('akun').value = '';
  document.getElementById('password').value = '';
  document.getElementById('nomorProvider').value = '';
  document.getElementById('status').textContent = '';
  document.getElementById('asuransi').focus();
}

// ========== HAPUS ITEM ==========
function hapusItem(index) {
  if (!confirm('Hapus data asuransi ini?')) return;
  
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'delete',
      index: index
    })
  })
  .then(() => {
    showToast('🗑️ Data dihapus');
    setTimeout(loadData, 500);
  })
  .catch(err => {
    console.error('Error delete:', err);
    showToast('⚠️ Gagal menghapus data', true);
  });
}

// ========== HAPUS SEMUA ==========
function hapusSemua() {
  if (!confirm('⚠️ Hapus SEMUA data asuransi? Ini tidak bisa dibatalkan!')) return;
  
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'deleteAll'
    })
  })
  .then(() => {
    showToast('🗑️ Semua data dihapus');
    setTimeout(loadData, 500);
  })
  .catch(err => {
    console.error('Error delete all:', err);
    showToast('⚠️ Gagal menghapus data', true);
  });
}

// ========== ENTER KEY ==========
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const btn = document.getElementById('simpanBtn');
    if (!btn.disabled) {
      simpan();
    }
  }
});

// ========== ONLOAD ==========
document.addEventListener("DOMContentLoaded", function() {
  const name = getAdminName();
  document.getElementById('userNameDisplay').textContent = name;
  document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
  
  loadData();
  
  const toastShown = sessionStorage.getItem('toastShown');
  if (!toastShown) {
    setTimeout(() => showToast(`👋 Selamat datang, ${name}!`), 300);
    sessionStorage.setItem('toastShown', 'true');
  }
});

// ========== SHORTCUT ==========
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') logout();
});

// ========== CLOSE SIDEBAR SAAT RESIZE ==========
window.addEventListener('resize', function() {
  if (window.innerWidth > 768) {
    closeSidebar();
  }
});
</script>
