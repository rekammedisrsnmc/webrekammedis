<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Asuransi | Medical Record</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="logorekammedis.ico">
<style>
:root{
  --green:#329951;
  --green-dark:#329951;
  --green-soft:#ffffff;
  --bg:#ffffff;
  --text:#329951;
  --line:#e5e7eb;
}

*{box-sizing:border-box;font-family:"Segoe UI",sans-serif}
body{
  margin:0;
  background:var(--bg);
  overflow-x:hidden;
}
.layout{display:flex;min-height:100vh}

/* ===== ANIMATION ===== */
@keyframes slideLeft{
  from{opacity:0;transform:translateX(-40px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeScale{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  background:linear-gradient(180deg,#16a34a,#15803d);
  color:#fff;
  padding:25px 20px;
}
.brand{text-align:center;margin-bottom:40px}
.brand i{font-size:42px;margin-bottom:10px}
.brand h2{margin:0;font-size:20px;font-weight:600}

.menu a{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;margin-bottom:14px;
  color:#ffffff;text-decoration:none;
  border-radius:14px;
  transition:.3s;font-size:15px;
}
.menu a:hover,.menu a.active{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px);
  transform:translateX(6px);
}

/* ===== CONTENT ===== */
.content{
  flex:1;
  padding:35px;
  animation:fadeScale .5s ease forwards;
  position:relative;
  z-index:1;
}

/* 🔐 HEADER DIPAKSA PALING ATAS */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  animation:slideUp .5s ease forwards;
  position:relative;
  z-index:9999;
}
.header h1{margin:0;color:var(--text)}

.user{
  display:flex;
  gap:10px;
  align-items:center;
  position:relative;
  z-index:9999;
}
.header-right{
  display:flex;
  align-items:center;
  gap:12px;
  position:relative;
  z-index:9999;
}
.logout{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
  transition:.3s;
  position:relative;
  z-index:9999;
}
.logout:hover{
  background:#dc2626;
  transform:translateY(-2px);
}

/* ===== SUB MENU IMUT ===== */
.menu-toggle{
  justify-content:space-between;
}

.arrow{
  margin-left:auto;
  transition:.3s;
}

.submenu{
  max-height:0;
  overflow:hidden;
  margin-left:25px;
  transition:max-height .35s ease;
}

.submenu a{
  font-size:14px;
  padding:10px 18px;
  margin-bottom:8px;
  background:rgba(255,255,255,.12);
  border-radius:12px;
}

.submenu.show{
  max-height:350px;
}

.submenu.show ~ .menu-toggle .arrow{
  transform:rotate(180deg);
}

/* ===== CARD ===== */
.card{
  background:#fff;
  border-radius:18px;
  padding:26px;
  margin-bottom:25px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  opacity:0;
  animation:slideUp .4s ease forwards;
  position:relative;
  z-index:1;
}
.card:nth-of-type(1){animation-delay:.10s}
.card:nth-of-type(2){animation-delay:.3s}

.card h3{margin-top:0;color:var(--green-dark)}

/* FORM */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px 24px;
}
.form-grid .full{
  grid-column:1 / -1;
}

label{font-size:13px;color:#065f46;font-weight:600;display:block;margin-bottom:4px;}
input,textarea{
  width:100%;
  padding:11px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  margin-bottom:6px;
  font-size:14px;
  transition:0.3s;
}
input:focus, textarea:focus{
  border-color:var(--green);
  outline:none;
  box-shadow:0 0 0 3px rgba(50,153,81,0.15);
}
textarea{min-height:80px;resize:vertical}

.btn-row{
  grid-column:1 / -1;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:6px;
}

button.primary{
  background:var(--green);
  color:#fff;
  border:none;
  padding:12px 24px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}
button.primary:hover{background:var(--green-dark);transform:translateY(-2px);}
button.primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
}

button.danger{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:12px 24px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}
button.danger:hover{background:#dc2626;transform:translateY(-2px);}

button.warning{
  background:#f59e0b;
  color:#fff;
  border:none;
  padding:12px 24px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}
button.warning:hover{background:#d97706;transform:translateY(-2px);}

button.small{
  padding:6px 14px;
  font-size:13px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:.3s;
}
button.small-danger{
  background:#fee2e2;
  color:#b91c1c;
  border:1px solid #fecaca;
}
button.small-danger:hover{
  background:#fecaca;
}

/* ===== LOADING SPINNER SEDERHANA ===== */
.loading-wrapper {
  display:flex;
  align-items:center;
  gap:12px;
  color:#555;
  padding:30px 0;
  justify-content:center;
}

.spinner {
  width:20px;
  height:20px;
  border:3px solid #ddd;
  border-top:3px solid var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

/* ===== LIST ===== */
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  opacity:0;
  animation:slideUp .45s ease forwards;
  transition:.3s;
}
.item:hover{
  background:#f8faf8;
  border-radius:10px;
}
.item:last-child{
  border-bottom:none;
}

.item .left{
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
}
.item .left .nama{
  font-weight:600;
  color:#065f46;
  font-size:16px;
}
.item .left .detail{
  font-size:13px;
  color:#6b7280;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
.item .left .detail span{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.item .left .detail .pass{
  font-family:monospace;
  background:#f3f4f6;
  padding:2px 8px;
  border-radius:4px;
  font-size:13px;
}
.item .right{
  display:flex;
  gap:8px;
  align-items:center;
}
.item .right a{
  color:var(--green);
  text-decoration:none;
  font-size:13px;
  padding:4px 12px;
  border-radius:8px;
  background:#f0fdf4;
  transition:.3s;
}
.item .right a:hover{
  background:var(--green);
  color:#fff;
}

/* ===== EMPTY STATE ===== */
.empty-state{
  text-align:center;
  padding:50px 20px;
  color:#999;
}
.empty-state i{
  font-size:50px;
  color:var(--green);
  opacity:0.3;
  display:block;
  margin-bottom:15px;
}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#16a34a;
  color:#fff;
  padding:12px 28px;
  border-radius:40px;
  font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);
  display:none;
  z-index:99999;
}
.toast.show{display:block;animation:slideUp 0.4s ease;}
.toast.error{background:#ef4444;}

/* ===== SPINNER SMALL (untuk button) ===== */
.spinner-sm{
  display:inline-block;
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,0.3);
  border-top:3px solid #fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}

footer{
  text-align:center;
  font-size:13px;
  color:#065f46;
  margin-top:40px;
  opacity:0;
  animation:fadeScale .5s ease forwards;
  animation-delay:.4s;
  position:relative;
  z-index:1;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%}
  .form-grid{
    grid-template-columns:1fr;
  }
  .form-grid .full{
    grid-column:auto;
  }
  .btn-row{
    flex-direction:column;
  }
  .btn-row button{
    width:100%;
    justify-content:center;
  }
  .item{
    flex-wrap:wrap;
    gap:10px;
  }
  .item .right{
    margin-left:auto;
  }
}
</style>
</head>

<body>
<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">
    <i class="fas fa-notes-medical"></i>
    <h2>ADMIN MR</h2>
  </div>
  <nav class="menu">
    <a href="admin_index.html"><i class="fas fa-gauge-high"></i> Dashboard</a>
    <a href="admin_regulasi.html"><i class="fas fa-file-medical"></i> Regulasi</a>
    <a href="admin_kunjungan.html"><i class="fas fa-chart-simple"></i> Kunjungan Pasien</a>
    <a href="admin_pemusnahan.html"><i class="fas fa-trash"></i> Pemusnahan</a>
    <a href="admin_rekapitulasi_scan.html"><i class="fas fa-trash"></i> Rekapitulasi Scan</a>
    <a href="javascript:void(0)" class="menu-toggle" onclick="toggleImut()">
        <i class="fas fa-chart-line"></i>
        <span>IMUT</span>
        <i class="fas fa-chevron-down arrow" id="imutArrow"></i>
      </a>

      <div class="submenu" id="imutSubmenu">
        <a href="admin_imutrekammedis.html">
            <i class="fas fa-file-medical"></i>Rekam Medis
        </a>
        <a href="admin_imutpendaftaran.html">
            <i class="fas fa-user-plus"></i>Pendaftaran
        </a>
        <a href="admin_i.html">
            <i class="fas fa-headset"></i>Customer Care
        </a>
    </div>
    <a href="admin_indikatorbor.html"><i class="fas fa-chart-simple"></i> Indikator</a>
    <a class="active" href="admin_asuransi.html"><i class="fas fa-shield-alt"></i> Asuransi</a>
  </nav>
</aside>

<!-- CONTENT -->
<main class="content">

<div class="header">
  <h1>Data Asuransi</h1>

  <div class="header-right">
    <div class="user">
      <i class="fas fa-user-shield"></i> Admin
    </div>
    <button class="logout" id="btnLogout">
      <i class="fas fa-right-from-bracket"></i> Logout
    </button>
  </div>
</div>

<div class="card">
<h3><i class="fas fa-pen" style="color:var(--green);margin-right:8px;"></i> Input Data Asuransi</h3>

<div class="form-grid">
  <div>
    <label>Nama Asuransi *</label>
    <input id="asuransi" placeholder="Contoh: BPJS Kesehatan" />
  </div>
  <div>
    <label>Link Aplikasi / Website</label>
    <input id="linkApp" placeholder="https://..." />
  </div>
  <div>
    <label>Akun / Username</label>
    <input id="akun" placeholder="Username" />
  </div>
  <div>
    <label>Password</label>
    <input id="password" placeholder="Password" type="password" />
  </div>
  <div class="full">
    <label>Nomor Provider / Telepon</label>
    <input id="nomorProvider" placeholder="Contoh: 021-1234567 atau 0812-3456-7890" />
  </div>
  <div class="btn-row">
    <button class="primary" id="simpanBtn" onclick="simpan()">
      <i class="fas fa-save"></i> Simpan
    </button>
    <button class="warning" onclick="resetForm()">
      <i class="fas fa-undo"></i> Reset
    </button>
    <button class="danger" onclick="hapusSemua()">
      <i class="fas fa-trash"></i> Hapus Semua
    </button>
  </div>
  <p id="status" style="grid-column:1/-1;font-size:14px;color:#16a34a;margin-top:-6px;"></p>
</div>
</div>

<div class="card">
<h3><i class="fas fa-list" style="color:var(--green);margin-right:8px;"></i> Daftar Asuransi</h3>
<div id="list">
  <!-- LOADING SPINNER SEDERHANA -->
  <div class="loading-wrapper">
    <div class="spinner"></div>
    <span>Memuat data asuransi...</span>
  </div>
</div>
</div>

<footer>© 2025 Admin Medical Record RSU An Ni'mah</footer>
</main>
</div>

<div class="toast" id="toastMsg"></div>

<script>
// ========== SESSION CHECK ==========
if(sessionStorage.getItem("adminLogin") !== "true"){
  window.location.href = "admin_index.html";
}

// ========== KONFIGURASI ==========
const API_URL = "https://script.google.com/macros/s/AKfycbyCmV0DgMN8R2zxQZdnZLSCS7sBmAjcL7E0pMsX7eEqosgRtaPIOxE2l4hG_UVocx6VMg/exec";

// ========== TOAST ==========
function showToast(msg, isError = false) {
  const toast = document.getElementById('toastMsg');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ========== SHOW LOADING ==========
function showLoading() {
  const box = document.getElementById('list');
  box.innerHTML = `
    <div class="loading-wrapper">
      <div class="spinner"></div>
      <span>Memuat data asuransi...</span>
    </div>
  `;
}

// ========== LOAD DATA ==========
function load() {
  showLoading();
  
  fetch(`${API_URL}?action=get`)
    .then(res => {
      if (!res.ok) throw new Error('Network error');
      return res.json();
    })
    .then(d => {
      render(d);
    })
    .catch(err => {
      console.error('❌ Error load:', err);
      showToast('⚠️ Gagal memuat data', true);
      render([]);
    });
}

// ========== RENDER ==========
function render(data) {
  const box = document.getElementById("list");
  
  if (!data || data.length === 0) {
    box.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-inbox"></i>
        <p>Belum ada data asuransi</p>
        <p style="font-size:13px;color:#bbb;margin-top:4px;">Silakan tambahkan data di form atas</p>
      </div>
    `;
    return;
  }
  
  let html = '';
  data.forEach((item, index) => {
    const asuransi = item[0] || '-';
    const linkApp = item[1] || '';
    const akun = item[2] || '-';
    const password = item[3] || '-';
    const nomorProvider = item[4] || '-';
    const timestamp = item[5] || '';
    
    html += `
      <div class="item" style="animation-delay:${index * 0.06}s">
        <div class="left">
          <div class="nama">${asuransi}</div>
          <div class="detail">
            ${akun !== '-' ? `<span><i class="fas fa-user"></i> ${akun}</span>` : ''}
            ${password !== '-' ? `<span><i class="fas fa-lock"></i> <span class="pass">${password}</span></span>` : ''}
            ${nomorProvider !== '-' ? `<span><i class="fas fa-phone"></i> ${nomorProvider}</span>` : ''}
            ${timestamp ? `<span><i class="fas fa-clock"></i> ${timestamp}</span>` : ''}
          </div>
        </div>
        <div class="right">
          ${linkApp ? `<a href="${linkApp}" target="_blank"><i class="fas fa-external-link-alt"></i> Buka</a>` : ''}
          <button class="small small-danger" onclick="hapusItem(${index})" title="Hapus">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    `;
  });
  
  box.innerHTML = html;
}

// ========== SIMPAN ==========
function simpan() {
  const asuransi = document.getElementById('asuransi').value.trim();
  const linkApp = document.getElementById('linkApp').value.trim();
  const akun = document.getElementById('akun').value.trim();
  const password = document.getElementById('password').value.trim();
  const nomorProvider = document.getElementById('nomorProvider').value.trim();
  
  if (!asuransi) {
    showToast('⚠️ Nama Asuransi wajib diisi!', true);
    document.getElementById('asuransi').focus();
    return;
  }
  
  const btn = document.getElementById('simpanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Menyimpan...';
  document.getElementById('status').textContent = '';
  
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      action: 'add',
      asuransi: asuransi,
      linkApp: linkApp,
      akun: akun,
      password: password,
      nomorProvider: nomorProvider
    })
  })
  .then(() => {
    showToast('✅ Data berhasil disimpan!');
    document.getElementById('status').textContent = '✅ Data berhasil disimpan!';
    resetForm();
    setTimeout(load, 500);
  })
  .catch(err => {
    console.error('❌ Error save:', err);
    showToast('⚠️ Gagal menyimpan data', true);
    document.getElementById('status').textContent = '❌ Gagal menyimpan data';
    document.getElementById('status').style.color = '#ef4444';
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Simpan';
  });
}

// ========== RESET FORM ==========
function resetForm() {
  document.getElementById('asuransi').value = '';
  document.getElementById('linkApp').value = '';
  document.getElementById('akun').value = '';
  document.getElementById('password').value = '';
  document.getElementById('nomorProvider').value = '';
  document.getElementById('status').textContent = '';
  document.getElementById('asuransi').focus();
}

// ========== HAPUS ITEM ==========
function hapusItem(index) {
  if (!confirm('Hapus data asuransi ini?')) return;
  
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      action: 'delete',
      index: index
    })
  })
  .then(() => {
    showToast('🗑️ Data dihapus');
    setTimeout(load, 500);
  })
  .catch(err => {
    console.error('❌ Error delete:', err);
    showToast('⚠️ Gagal menghapus data', true);
  });
}

// ========== HAPUS SEMUA ==========
function hapusSemua() {
  if (!confirm('⚠️ Hapus SEMUA data asuransi? Ini tidak bisa dibatalkan!')) return;
  
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      action: 'deleteAll'
    })
  })
  .then(() => {
    showToast('🗑️ Semua data dihapus');
    setTimeout(load, 500);
  })
  .catch(err => {
    console.error('❌ Error delete all:', err);
    showToast('⚠️ Gagal menghapus data', true);
  });
}

// ========== ENTER KEY ==========
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const btn = document.getElementById('simpanBtn');
    if (!btn.disabled) {
      simpan();
    }
  }
});

// ========== LOGOUT ==========
document.getElementById("btnLogout").addEventListener("click", function(){
  if(confirm("Yakin ingin logout?")){
    sessionStorage.removeItem("adminLogin");
    window.location.href = "admin_index.html";
  }
});

// ========== TOGGLE IMUT ==========
function toggleImut(){
  const sub = document.getElementById("imutSubmenu");
  const arrow = document.getElementById("imutArrow");
  sub.classList.toggle("show");
  arrow.classList.toggle("rotate");
}

// ========== INIT ==========
window.onload = load;
</script>

</body>
</html>
